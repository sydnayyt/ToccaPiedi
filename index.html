<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizzo Denuncia</title>
<style>
:root{color-scheme:dark;--bg:#0d1230;--fg:#fff;--red:#ff3b3b;--blue:#2d7bff;--yel:#ffd60a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Comic Sans MS","Chalkboard SE","Marker Felt",cursive,sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:relative;max-width:900px;margin:0 auto}
canvas{width:100%;display:block;background:#8fd3ff;touch-action:none}
.ov{position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vw;text-align:center;overflow:hidden;background:repeating-linear-gradient(45deg,#0d1230 0 24px,#141b47 24px 48px)}
.ov.hide,.hide{display:none!important}
.siren{position:absolute;top:0;width:50%;height:100%;opacity:.35;animation:fl 0.6s steps(1) infinite}
.siren.a{left:0;background:radial-gradient(circle at 20% 0,var(--red),transparent 60%)}
.siren.b{right:0;background:radial-gradient(circle at 80% 0,var(--blue),transparent 60%);animation-delay:.3s}
@keyframes bn{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.08)}}@keyframes fl{0%{opacity:.7}50%{opacity:.1}}
h1{position:relative;margin:0;font-size:clamp(28px,8vw,72px);line-height:1;color:var(--yel);text-transform:uppercase;animation:bn 1.2s ease-in-out infinite;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,6px 6px 0 var(--red);letter-spacing:2px}
h1 small{display:block;font-size:.35em;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:6px}
.ov p{position:relative;margin:0;font-size:clamp(11px,2.2vw,18px);max-width:80%}
input,button{font-family:inherit}
#nm{position:relative;font-size:clamp(14px,3vw,24px);text-align:center;padding:.4em .8em;border:4px solid #000;border-radius:14px;background:#fff;color:#000;width:55%;max-width:320px;text-transform:uppercase}
.btn{position:relative;font-size:clamp(14px,3.4vw,28px);padding:.4em 1.2em;border:4px solid #000;border-radius:14px;background:var(--yel);color:#000;font-weight:900;box-shadow:0 6px 0 #000;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
#boss{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:6px}
#bi{width:80%;font-size:clamp(14px,3vw,24px);padding:.3em .6em;border:4px solid #000;border-radius:12px;background:#fff;color:#000;text-align:center}
#pad{display:flex;justify-content:space-between;padding:10px 14px;max-width:900px;margin:0 auto;touch-action none}
#pad div{display:flex;gap:10px}
#pad button{width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);font-size:28px;border-radius:50%;border:4px solid #000;background:#ffffffcc;color:#000;touch-action:none;box-shadow:0 5px 0 #000}
#pad button:active{background:var(--yel)}
@media (orientation:landscape) and (max-height:600px){
html,body{overflow:hidden}
#wrap{width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9))}
#pad{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;padding:0 max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
#pad button{pointer-events:auto;width:18vh;height:18vh;max-width:84px;max-height:84px;opacity:.72}
#boss{top:46%;bottom:auto}
.ov h1{font-size:min(8vw,13vh)}.ov p{font-size:min(2.2vw,3.6vh)}.ov{gap:1.5vh}
}
</style></head><body>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div id="menu" class="ov"><div class="siren a"></div><div class="siren b"></div>
<h1>Rizzo<small>★ denuncia ★</small></h1>
<p>🚔 Inserisci il nome del tuo agente:</p>
<input id="nm" maxlength="12" placeholder="AGENTE" autocomplete="off" spellcheck="false">
<button class="btn" id="go">GIOCA!</button>
<p>← → muovi · ↑ / Spazio salta · X spara<br>Sconfiggi Rizzo, Trischittae e Sciacca. Poi arriva ONKALA!</p></div>
<div id="end" class="ov hide"><div class="siren a"></div><div class="siren b"></div>
<h1 id="et">Game over</h1><p id="ep"></p>
<div style="position:relative;display:flex;gap:14px"><button class="btn" id="retry">RIPROVA</button><button class="btn" id="tomenu">MENU</button></div></div>
<div id="boss" class="hide"><input id="bi" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="scrivi la denuncia qui..."></div>
</div>
<div id="pad" class="hide"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="f">🔫</button><button data-k="d">💨</button><button data-k="j">⤒</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=450,$=id=>document.getElementById(id);
const WORDS=['trischio','denuncia','spartaco','sciacca','fabbbio','counter strike 2','fortnite','rizzo','relling','iban'];
const LV=[['Trischio City','#3d9bff','#d6efff','#2c4a7c'],['Via Spartaco','#ff9a56','#ffe3b8','#7a3b3b'],['Sciacca Beach','#2bc3d6','#d9fbff','#2d6a78'],['Fabbbio Arena','#8a5cff','#e5d8ff','#44307a'],['Counter Strike 2 Map','#b59a62','#f1e3bd','#5d4c2c'],['Fortnite Island','#3fd17a','#d3ffe3','#276b45'],['Relling Tower','#ff6b9a','#ffd9e6','#7a2e4a'],['IBAN Bank','#4f6bff','#d5dcff','#262f7a']];
const BC=['Boss','#2a1040','#8a4a9a','#1b0f2e'];
const ET=[{n:'Rizzo',c:'#e63946',hp:2,s:80,k:'w'},{n:'Trischittae',c:'#f4a261',hp:3,s:55,k:'r'},{n:'Sciacca',c:'#2a9d8f',hp:2,s:100,k:'d'}];
const PHR=['denuncia a rizzo','denuncia a rizzo e sciacca','spartaco denuncia rizzo','fortnite denuncia a rizzo'];
const keys={},pad={};
let mode='menu',name='AGENTE',lvl=0,score=0,p,plats=[],enemies=[],bullets=[],eb=[],items=[],pops=[],parts=[],rocks=[],len=800,kills=0,total=0,cam=0,banner=0,boss={},shk=0,frz=0,combo=0,ctm=0,pj=0,pd=0,T=0,inBoss=false;
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.4,l:.4+Math.random()*.4,c,s:2+Math.random()*4})}}
function newPlayer(hp){p={x:40,y:340,w:26,h:42,vx:0,vy:0,on:false,face:1,hp,inv:0,cd:0,coy:0,buf:0,jumps:0,dash:0,dcd:0,pw:null,pt:0}}
function phys(o,dt){o.vy+=1500*dt;o.x+=o.vx*dt;const py=o.y;o.y+=o.vy*dt;o.on=false;
  for(const pl of plats)if(o.vy>=0&&py+o.h<=pl.y+3&&o.y+o.h>=pl.y&&o.x+o.w>pl.x&&o.x<pl.x+pl.w){o.y=pl.y-o.h;o.vy=0;o.on=true;o.pl=pl}}
function loadLevel(i){
  mode='play';inBoss=false;lvl=i;$('boss').classList.add('hide');$('pad').classList.remove('hide');
  const r=rng(i*977+13);len=1900+i*350;plats=[{x:0,y:400,w:len,h:50}];
  let x=260;while(x<len-260){const w=90+r()*100;plats.push({x,y:r()<.35?210+r()*50:290+r()*60,w,h:16});x+=w+50+r()*130}
  total=5+i*2;kills=0;enemies=[];bullets=[];eb=[];items=[];pops=[];parts=[];combo=0;
  for(let k=0;k<total;k++){
    const pl=plats[k%3===0?0:1+Math.floor(r()*(plats.length-1))],t=ET[Math.floor(r()*3)];
    const ex=pl===plats[0]?400+r()*(len-700):pl.x+r()*Math.max(1,pl.w-26),hp=t.hp+Math.floor(i/3);
    enemies.push({x:ex,y:pl.y-42,w:26,h:42,vx:0,vy:0,on:false,t,hp,m:hp,a:Math.max(pl.x,ex-250),b:Math.min(pl.x+pl.w-26,ex+250),dir:r()<.5?-1:1,face:1,tm:1+r()*2,fl:0});
  }
  const K=['iban','fort','cs2'];
  for(let k=0;k<3;k++){const pl=plats[1+Math.floor(r()*(plats.length-1))];items.push({x:pl.x+pl.w/2-14,y:pl.y-36,w:28,h:28,k:k===0?'iban':K[Math.floor(r()*3)]})}
  const hp=p?Math.min(5,p.hp+1):5;newPlayer(hp);cam=0;banner=2.4;
}
function startBoss(){
  mode='boss';inBoss=true;plats=[{x:0,y:400,w:W,h:50}];len=W;enemies=[];items=[];pops=[];bullets=[];eb=[];rocks=[];cam=0;
  newPlayer(p?p.hp:5);p.x=90;boss={r:0,t:10,hurt:0,shake:0,rt:2,dead:false,x:470};
  $('pad').classList.add('hide');$('boss').classList.remove('hide');$('bi').value='';setTimeout(()=>$('bi').focus(),50);
}
function startGame(){name=($('nm').value.trim()||'AGENTE').toUpperCase();score=0;lvl=0;newPlayer(5);$('menu').classList.add('hide');$('end').classList.add('hide');loadLevel(0)}
function endScreen(win){
  mode='end';$('boss').classList.add('hide');$('pad').classList.add('hide');$('bi').blur();
  $('et').innerHTML=win?'Vittoria!':'Game over';
  $('ep').textContent=win?`${name}, Onkala è stato sconfitto e Rizzo è stato denunciato! Punteggio: ${score}`:`${name} è stato sconfitto... Punteggio: ${score}`;
  $('retry').classList.toggle('hide',win);$('end').classList.remove('hide');
}
$('retry').onclick=()=>{$('end').classList.add('hide');p=null;inBoss?startBoss():loadLevel(lvl)};
$('tomenu').onclick=()=>{$('end').classList.add('hide');$('menu').classList.remove('hide');mode='menu'};
$('go').onclick=startGame;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();pad[k]=1});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>pad[k]=0));
  b.addEventListener('contextmenu',e=>e.preventDefault())});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
cv.addEventListener('pointerdown',()=>{if(mode==='boss')$('bi').focus()});
$('bi').addEventListener('input',()=>{
  if(mode!=='boss'||boss.dead||$('bi').value.trim().toLowerCase()!==PHR[boss.r])return;
  $('bi').value='';score+=1000;boss.hurt=.6;boss.shake=.6;shk=.45;p.cd=.3;
  for(const r of rocks)burst(r.x,r.y,14,'#999',260);rocks=[];
  for(let i=0;i<4;i++)bullets.push({x:p.x+30,y:p.y+14+i*3,vx:760,vy:(i-1.5)*20,l:.7,d:0});
  burst(boss.x+90,boss.y0||250,36,'#7cff4a',400);
  pops.push({x:boss.x+40,y:150,t:'DENUNCIATO!',l:1.3});boss.r++;boss.t=10;
  if(boss.r>=PHR.length){score+=5000;boss.dead=true;setTimeout(()=>{if(mode==='boss')endScreen(true)},1100)}
});
function fire(){
  const f=p.face,x=p.x+(f>0?p.w+8:-8),y=p.y+19;
  if(p.pw==='fort'){p.cd=.5;for(let i=-2;i<=2;i++)bullets.push({x,y,vx:f*600,vy:i*60,l:.4,d:1})}
  else if(p.pw==='cs2'){p.cd=.09;bullets.push({x,y,vx:f*720,vy:(Math.random()-.5)*60,l:.9,d:1})}
  else{p.cd=.28;bullets.push({x,y,vx:f*650,vy:0,l:1,d:1})}
  burst(x,y,5,'#ffe066',220);p.vx-=f*40;
}
function hurt(sx){
  if(p.inv>0||p.dash>0)return;p.hp--;p.inv=1.3;p.vy=-320;p.vx=(p.x<sx?-1:1)*260;shk=.3;frz=.06;combo=0;burst(p.x+13,p.y+20,16,'#ff3b3b',280);
}
function killE(e){
  e.dead=1;kills++;combo=ctm>0?Math.min(combo+1,5):1;ctm=2.5;score+=100*combo;shk=.22;frz=.06;
  burst(e.x+13,e.y+21,26,e.t.c,340);burst(e.x+13,e.y+21,10,'#fff',260);
  pops.push({x:e.x,y:e.y-20,t:(combo>1?'x'+combo+' ':'')+WORDS[Math.floor(Math.random()*WORDS.length)].toUpperCase()+'!',l:1.1});
}
function update(d0){
  if(mode!=='play'&&mode!=='boss')return;
  let dt=d0;if(frz>0){frz-=d0;dt*=.15}
  T+=dt;shk=Math.max(0,shk-d0);
  for(const o of pops){o.l-=dt;o.y-=30*dt}pops=pops.filter(o=>o.l>0);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt}bullets=bullets.filter(b=>b.l>0);
  mode==='boss'?bossStep(dt):playStep(dt);
}
function bossStep(dt){
  p.vx=0;p.inv-=dt;p.cd-=dt;phys(p,dt);if(boss.dead)return;
  boss.t-=dt;boss.hurt-=dt;boss.shake-=dt;boss.rt-=dt;boss.x=470-(boss.t<3?(3-boss.t)*14:0);
  if(boss.rt<=0){boss.rt=2.4;rocks.push({sx:boss.x+30,sy:200,u:0,x:0,y:0})}
  for(const r of rocks){r.u+=dt/1.6;r.x=r.sx+(p.x+13-r.sx)*r.u;r.y=r.sy+(p.y+12-r.sy)*r.u-80*Math.sin(Math.PI*r.u);if(r.u>=1){r.dead=1;burst(r.x,r.y,12,'#999',240);hurt(r.x+(Math.random()<.5?-1:1))}}
  rocks=rocks.filter(r=>!r.dead);
  if(boss.t<=0||p.hp<=0)endScreen(false);
}
function playStep(dt){
  const L=keys.ArrowLeft||keys.KeyA||pad.l,R=keys.ArrowRight||keys.KeyD||pad.r,J=keys.ArrowUp||keys.KeyW||keys.Space||pad.j,F=keys.KeyX||keys.KeyZ||keys.KeyJ||pad.f,D=keys.ShiftLeft||keys.ShiftRight||keys.KeyC||keys.KeyK||pad.d;
  const dir=(R?1:0)-(L?1:0);if(dir)p.face=dir;
  const jp=J&&!pj,dp=D&&!pd;pj=J;pd=D;
  p.cd-=dt;p.inv-=dt;p.dcd-=dt;p.buf-=dt;p.coy-=dt;banner-=dt;ctm-=dt;if(ctm<=0)combo=0;
  if(p.pt>0){p.pt-=dt;if(p.pt<=0)p.pw=null}
  if(jp)p.buf=.12;
  if(dp&&p.dcd<=0){p.dash=.16;p.dcd=.8;burst(p.x+13,p.y+22,8,'#fff',120)}
  if(p.dash>0){p.dash-=dt;p.vx=p.face*540;p.vy=0;if(Math.random()<.7)burst(p.x+13,p.y+22,1,'#9cf',20)}
  else p.vx+=(dir*240-p.vx)*Math.min(1,dt*(p.on?16:7));
  if(p.buf>0){
    if(p.coy>0){p.vy=-600;p.buf=0;p.coy=0;burst(p.x+13,p.y+42,8,'#e8dcb8',140)}
    else if(p.jumps<1){p.vy=-560;p.jumps++;p.buf=0;burst(p.x+13,p.y+42,12,'#fff',160)}
  }
  if(!J&&p.vy<-230&&p.dash<=0)p.vy=-230;
  if(F&&p.cd<=0)fire();
  const was=p.on,vy0=p.vy;phys(p,dt);p.x=clamp(p.x,0,len-p.w);
  if(p.on){if(!was&&vy0>420){burst(p.x+13,p.y+42,8,'#e8dcb8',150);shk=Math.max(shk,.08)}p.jumps=0;p.coy=.1;if(Math.abs(p.vx)>60&&Math.random()<.25)burst(p.x+13,p.y+42,1,'#e8dcb8',60)}
  for(const e of enemies){
    e.fl-=dt;e.tm-=dt;const dx=p.x-e.x,ad=Math.abs(dx),sg=dx<0?-1:1;
    if(ad<340&&Math.abs(p.y-e.y)<110){
      e.face=sg;
      if(e.t.k==='r'){e.vx=ad<190?-sg*e.t.s:ad>260?sg*e.t.s:0;if(e.tm<=0){e.tm=1.8;eb.push({x:e.x+13,y:e.y+16,vx:sg*280,vy:-80,l:2})}}
      else{e.vx=sg*e.t.s*1.4;if(e.t.k==='d'&&e.on&&ad<170&&e.tm<=0){e.vy=-480;e.tm=1.5}}
    }else{e.vx=e.dir*e.t.s*.6;e.face=e.dir}
    phys(e,dt);
    if(e.x<=e.a){e.x=e.a;e.dir=1}else if(e.x>=e.b){e.x=e.b;e.dir=-1}
    if(!e.dead&&hit(p,e)){
      if(p.vy>100&&p.y+p.h-e.y<24&&p.dash<=0){e.hp-=2;e.fl=.15;p.vy=-460;p.jumps=0;burst(e.x+13,e.y,8,'#fff',200);if(e.hp<=0)killE(e)}
      else hurt(e.x);
    }
  }
  for(const b of bullets){const bb={x:b.x-5,y:b.y-3,w:10,h:6};
    for(const e of enemies)if(!e.dead&&b.l>0&&hit(bb,e)){e.hp-=b.d;b.l=0;e.fl=.12;e.x=clamp(e.x+Math.sign(b.vx)*8,e.a,e.b);burst(b.x,b.y,6,'#ffe066',220);if(e.hp<=0)killE(e)}}
  enemies=enemies.filter(e=>!e.dead);
  for(const b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=250*dt;b.l-=dt;if(hit({x:b.x-5,y:b.y-5,w:10,h:10},p)){b.l=0;hurt(b.x)}}
  eb=eb.filter(b=>b.l>0);
  for(const it of items)if(!it.got&&hit(p,it)){it.got=1;score+=50;burst(it.x+14,it.y+14,16,'#ffd60a',260);
    if(it.k==='iban'){p.hp=Math.min(5,p.hp+1);pops.push({x:it.x,y:it.y-10,t:'IBAN +♥',l:1.1})}
    else{p.pw=it.k;p.pt=10;pops.push({x:it.x,y:it.y-10,t:it.k==='fort'?'FORTNITE SHOTGUN!':'COUNTER STRIKE 2 RAPID!',l:1.4})}}
  items=items.filter(i=>!i.got);
  if(kills>=total&&p.x>len-110){score+=500;lvl+1>=LV.length?startBoss():loadLevel(lvl+1);return}
  cam+=(clamp(p.x-W*.4+p.face*60,0,len-W)-cam)*Math.min(1,dt*6);
  if(p.hp<=0)endScreen(false);
}
/* ---------- grafica ---------- */
function rr(x,y,w,h,c,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r||3);ctx.fillStyle=c;ctx.fill();ctx.save();ctx.clip();ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,w,h*.42);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(x,y+h*.78,w,h*.22);ctx.restore();ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='#1a1030';ctx.stroke()}
function ell(x,y,rx,ry,c,ns){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=c;ctx.fill();if(!ns){ctx.save();ctx.clip();ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(x-rx*.2,y-ry*.45,rx*.6,ry*.35,0,0,7);ctx.fill();ctx.restore();ctx.lineWidth=4;ctx.strokeStyle='#1a1030';ctx.stroke()}}
function txt(t,x,y,s,c){ctx.font=`900 ${s}px "Comic Sans MS",cursive,sans-serif`;ctx.textAlign='center';ctx.lineWidth=s/3;ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.strokeText(t,x,y);ctx.fillStyle=c||'#fff';ctx.fillText(t,x,y)}
function shadow(o){if(!o.pl)return;const h=Math.max(0,o.pl.y-(o.y+o.h));ctx.fillStyle=`rgba(0,0,0,${clamp(.35-h/500,.05,.35)})`;ctx.beginPath();ctx.ellipse(o.x+13,o.pl.y,Math.max(5,15-h/18),4,0,0,7);ctx.fill()}
function person(o,col,cop,flash){
  if(cop&&o.inv>0&&Math.floor(T*25)%2)return;
